<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Prueba Háptica</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      -webkit-user-select: none;
      user-select: none;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    button {
      width: 100%;
      max-width: 360px;
      padding: 28px 16px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .08s;
    }
    button:active { transform: scale(.96); }
    button small { display: block; font-weight: 400; opacity: .8; margin-top: 4px; font-size: .9rem; }
    #larga { background: #2563eb; }
    #corta { background: #16a34a; }
    #extra { background: #ea580c; }
    #estado { min-height: 1.5em; color: #9ca3af; text-align: center; }
    #estado.error { color: #f87171; }
  </style>
</head>
<body>
  <h1>Prueba Háptica</h1>
  <button id="larga" data-ms="1000">Vibración larga<small>1000 ms</small></button>
  <button id="corta" data-ms="200">Vibración corta<small>200 ms</small></button>
  <button id="extra" data-ms="40">Vibración extra corta<small>40 ms</small></button>
  <p id="estado"></p>

  <script>
    const estado = document.getElementById('estado');

    if (!('vibrate' in navigator)) {
      estado.textContent = 'Este navegador no soporta la API de vibración.';
      estado.className = 'error';
    }

    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const ms = Number(btn.dataset.ms);
        if (!('vibrate' in navigator)) return;
        navigator.vibrate(0); // corta cualquier vibración en curso
        const ok = navigator.vibrate(ms);
        estado.className = ok ? '' : 'error';
        estado.textContent = ok ? `Vibrando ${ms} ms` : 'El dispositivo rechazó la vibración.';
      });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
