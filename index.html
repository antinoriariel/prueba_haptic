<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Prueba Háptica</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      -webkit-user-select: none;
      user-select: none;
      transition: background .15s;
    }
    body.destello { background: #1e3a8a; }
    section {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
    button {
      width: 100%;
      padding: 28px 16px;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      background: #374151;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .08s, opacity .15s;
    }
    button:active { transform: scale(.96); }
    button small { display: block; font-weight: 400; opacity: .8; margin-top: 4px; font-size: .9rem; }
    button.secundario, a.boton {
      display: block;
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: transparent;
      border: 1px solid #4b5563;
      border-radius: 16px;
    }
    .ntfy { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: #1f2937; }
    .ntfy p { margin: 0; color: #d1d5db; font-size: .95rem; line-height: 1.4; }
    .ntfy code { font-size: .95rem; color: #93c5fd; word-break: break-all; -webkit-user-select: all; user-select: all; }
    .ntfy a.enlace { color: #93c5fd; font-size: .9rem; text-align: center; }
    .botonera { display: flex; flex-direction: column; gap: 20px; }
    input {
      width: 100%;
      padding: 18px;
      font: inherit;
      font-size: 2rem;
      letter-spacing: .4em;
      text-align: center;
      text-transform: uppercase;
      color: #f9fafb;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 16px;
    }
    .codigo { text-align: center; }
    .codigo span { display: block; color: #9ca3af; font-size: .9rem; }
    .codigo strong { font-size: 3rem; letter-spacing: .3em; padding-left: .3em; }
    .estado { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .punto { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; }
    .punto.espera { background: #eab308; }
    .punto.ok { background: #22c55e; }
    .punto.error { background: #ef4444; }
    .registro { min-height: 1.5em; margin: 0; color: #9ca3af; text-align: center; }
    .registro.error { color: #f87171; }
  </style>
</head>
<body>
  <section id="inicio">
    <h1>Prueba Háptica</h1>
    <button id="ir-servidor">Recibir vibraciones<small>Este móvil vibra (servidor)</small></button>
    <button id="ir-cliente">Enviar vibraciones<small>Este móvil hace vibrar al otro (cliente)</small></button>
    <button id="ir-local" class="secundario">Probar en este móvil</button>
    <p class="registro error" id="aviso-vibracion"></p>
  </section>

  <section id="unirse" hidden>
    <h1>Unirse a una sala</h1>
    <form id="form-unirse">
      <input id="input-codigo" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CÓDIGO" required>
    </form>
    <button form="form-unirse">Conectar</button>
    <button class="secundario volver">Volver</button>
  </section>

  <section id="sala" hidden>
    <h1 id="sala-titulo"></h1>
    <div class="codigo"><span>Código de sala</span><strong id="sala-codigo"></strong></div>
    <button id="compartir" class="secundario">Compartir enlace</button>
    <div class="estado"><span class="punto" id="estado-punto"></span><span id="estado-texto"></span></div>
    <div class="ntfy" id="bloque-ntfy">
      <p><strong>Con el móvil bloqueado</strong> la vibración llega por la app <strong>ntfy</strong>. Instálala, suscríbete a este tema y activa la «entrega instantánea»:</p>
      <code id="ntfy-tema"></code>
      <a class="boton" id="ntfy-suscribir">Suscribirme en ntfy</a>
      <a class="enlace" href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Instalar ntfy desde Google Play</a>
    </div>
    <div class="botonera" id="botonera-remota"></div>
    <p class="registro" id="sala-registro"></p>
    <button class="secundario" id="salir">Salir</button>
  </section>

  <section id="local" hidden>
    <h1>Prueba en este móvil</h1>
    <div class="botonera" id="botonera-local"></div>
    <p class="registro" id="local-registro"></p>
    <button class="secundario volver">Volver</button>
  </section>

  <script src="vendor/mqtt.min.js"></script>
  <script>
    const BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const PREFIJO = 'antinoriariel/prueba_haptic/v1/';
    const NTFY = 'https://ntfy.sh/';
    const ALFABETO = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const TIPOS = [
      // prioridad: nivel de ntfy (5 = vibración muy larga, 4 = larga, 3 = corta)
      { nombre: 'Vibración larga', ms: 1000, prioridad: 5, color: '#2563eb' },
      { nombre: 'Vibración corta', ms: 200, prioridad: 4, color: '#16a34a' },
      { nombre: 'Vibración extra corta', ms: 40, prioridad: 3, color: '#ea580c' },
    ];

    const $ = id => document.getElementById(id);
    const soportaVibracion = 'vibrate' in navigator;

    function mostrar(pantalla) {
      document.querySelectorAll('section').forEach(s => s.hidden = s.id !== pantalla);
    }

    function registro(el, texto, error = false) {
      el.textContent = texto;
      el.classList.toggle('error', error);
    }

    function vibrar(ms) {
      if (!soportaVibracion) return false;
      navigator.vibrate(0); // corta cualquier vibración en curso
      return navigator.vibrate(ms);
    }

    function crearBotonera(contenedor, alPulsar) {
      for (const t of TIPOS) {
        const b = document.createElement('button');
        b.style.background = t.color;
        b.innerHTML = `${t.nombre}<small>${t.ms} ms</small>`;
        b.addEventListener('click', () => alPulsar(t));
        contenedor.append(b);
      }
    }

    const temaNtfy = codigo => 'antinoriariel_haptic_' + codigo;

    function generarCodigo() {
      const n = crypto.getRandomValues(new Uint32Array(4));
      return Array.from(n, x => ALFABETO[x % ALFABETO.length]).join('');
    }

    // Se recuerdan los códigos para no tener que volver a suscribirse en ntfy cada vez
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch { return null; }
    }
    function guardar(clave, valor) {
      try { localStorage.setItem(clave, valor); } catch {}
    }

    // --- Prueba local ---

    crearBotonera($('botonera-local'), ({ ms }) => {
      if (!soportaVibracion) return registro($('local-registro'), 'Este navegador no soporta la API de vibración.', true);
      const ok = vibrar(ms);
      registro($('local-registro'), ok ? `Vibrando ${ms} ms` : 'El dispositivo rechazó la vibración.', !ok);
    });

    // --- Sala remota (servidor recibe, cliente envía) ---

    let sesion = null;   // { rol, codigo, mqtt, enviar, otroPresente }
    let wakeLock = null;
    let siguienteId = 0;
    const pendientes = new Map();

    function estado(texto, tipo) {
      $('estado-texto').textContent = texto;
      $('estado-punto').className = 'punto ' + tipo;
    }

    // En el cliente, «presente» significa que el servidor tiene la app en pantalla:
    // si no, las vibraciones se envían por ntfy para que lleguen con el móvil bloqueado.
    function setOtroPresente(presente) {
      sesion.otroPresente = presente;
      if (sesion.rol === 'servidor') {
        estado(presente ? 'Cliente conectado' : 'Esperando cliente…', presente ? 'ok' : 'espera');
      } else {
        estado(presente ? 'Servidor conectado' : 'Servidor sin pantalla: se enviará por ntfy', presente ? 'ok' : 'espera');
      }
    }

    async function mantenerPantalla() {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    }

    function entrarSala(rol, codigo) {
      guardar(rol === 'servidor' ? 'codigo-servidor' : 'codigo-cliente', codigo);
      const topic = PREFIJO + codigo;
      const esServidor = rol === 'servidor';
      $('sala-titulo').textContent = esServidor ? 'Recibiendo vibraciones' : 'Enviando vibraciones';
      $('sala-codigo').textContent = codigo;
      $('compartir').hidden = !esServidor;
      $('bloque-ntfy').hidden = !esServidor;
      $('ntfy-tema').textContent = temaNtfy(codigo);
      $('ntfy-suscribir').href = 'ntfy://ntfy.sh/' + temaNtfy(codigo);
      $('botonera-remota').hidden = esServidor;
      registro($('sala-registro'), esServidor && !soportaVibracion ? 'Este navegador no soporta la API de vibración.' : '', !soportaVibracion);
      mostrar('sala');
      if (esServidor) mantenerPantalla();

      const cliente = mqtt.connect(BROKER, {
        keepalive: 15,
        connectTimeout: 10000,
        will: { topic, payload: JSON.stringify({ de: rol, tipo: 'adios' }), qos: 0, retain: false },
      });
      const enviar = msg => cliente.publish(topic, JSON.stringify({ de: rol, ...msg }));
      sesion = { rol, codigo, mqtt: cliente, enviar };
      setOtroPresente(false);
      estado('Conectando…', 'espera');

      cliente.on('connect', () => cliente.subscribe(topic, err => {
        if (err) return estado('Error al unirse a la sala', 'error');
        setOtroPresente(false);
        enviar({ tipo: 'hola' });
      }));
      cliente.on('reconnect', () => estado('Reconectando…', 'error'));
      cliente.on('offline', () => estado('Sin conexión', 'error'));

      cliente.on('message', (_, payload) => {
        let m;
        try { m = JSON.parse(payload); } catch { return; }
        if (m.de === rol) return; // el broker nos devuelve nuestros propios mensajes

        if (m.tipo === 'hola') {
          // Con la pantalla apagada el servidor no se anuncia: el cliente debe usar ntfy
          if (!m.respuesta && !(esServidor && document.hidden)) enviar({ tipo: 'hola', respuesta: true });
          setOtroPresente(true);
        } else if (m.tipo === 'adios') {
          setOtroPresente(false);
        } else if (m.tipo === 'vibrar' && esServidor) {
          setOtroPresente(true);
          const ok = vibrar(m.ms);
          enviar({ tipo: 'vibrado', id: m.id, ok });
          registro($('sala-registro'), ok ? `Recibido: vibración de ${m.ms} ms` : `Recibido ${m.ms} ms, pero el dispositivo rechazó la vibración.`, !ok);
          document.body.classList.add('destello');
          setTimeout(() => document.body.classList.remove('destello'), Math.max(m.ms, 150));
        } else if (m.tipo === 'vibrado' && !esServidor) {
          const t0 = pendientes.get(m.id);
          pendientes.delete(m.id);
          const idaVuelta = t0 ? ` (${Math.round(performance.now() - t0)} ms ida y vuelta)` : '';
          registro($('sala-registro'), m.ok ? `Vibró en el otro móvil${idaVuelta}` : 'El otro móvil no pudo vibrar.', !m.ok);
        }
      });
    }

    function salirSala() {
      if (!sesion) return;
      sesion.enviar({ tipo: 'adios' });
      sesion.mqtt.end();
      sesion = null;
      wakeLock?.release();
      wakeLock = null;
      pendientes.clear();
      history.replaceState(null, '', location.pathname);
      mostrar('inicio');
    }

    crearBotonera($('botonera-remota'), async t => {
      if (sesion.otroPresente) {
        const id = ++siguienteId;
        pendientes.set(id, performance.now());
        sesion.enviar({ tipo: 'vibrar', ms: t.ms, id });
        return registro($('sala-registro'), `Enviado: ${t.ms} ms…`);
      }
      registro($('sala-registro'), 'Enviando por ntfy…');
      try {
        const r = await fetch(NTFY, {
          method: 'POST',
          body: JSON.stringify({ topic: temaNtfy(sesion.codigo), title: t.nombre, message: 'Prueba Háptica', priority: t.prioridad, tags: ['vibration_mode'] }),
        });
        if (!r.ok) throw new Error(r.status);
        registro($('sala-registro'), `Enviado por ntfy: ${t.nombre.toLowerCase()}`);
      } catch {
        registro($('sala-registro'), 'No se pudo enviar por ntfy.', true);
      }
    });

    $('compartir').addEventListener('click', async () => {
      const url = location.origin + location.pathname + '#' + sesion.codigo;
      if (navigator.share) {
        try { await navigator.share({ title: 'Prueba Háptica', text: `Únete con el código ${sesion.codigo}`, url }); } catch {}
      } else {
        try {
          await navigator.clipboard.writeText(url);
          registro($('sala-registro'), 'Enlace copiado');
        } catch {
          registro($('sala-registro'), url);
        }
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (sesion?.rol !== 'servidor') return;
      if (document.visibilityState === 'visible') {
        mantenerPantalla();
        sesion.enviar({ tipo: 'hola' });
      } else {
        sesion.enviar({ tipo: 'adios' });
      }
    });
    addEventListener('pagehide', () => sesion?.enviar({ tipo: 'adios' }));

    // --- Navegación ---

    $('ir-servidor').addEventListener('click', () => entrarSala('servidor', leer('codigo-servidor') || generarCodigo()));
    $('ir-cliente').addEventListener('click', () => {
      $('input-codigo').value = leer('codigo-cliente') || '';
      mostrar('unirse');
      $('input-codigo').focus();
    });
    $('ir-local').addEventListener('click', () => mostrar('local'));
    $('salir').addEventListener('click', salirSala);
    document.querySelectorAll('.volver').forEach(b => b.addEventListener('click', () => mostrar('inicio')));
    $('form-unirse').addEventListener('submit', e => {
      e.preventDefault();
      const codigo = $('input-codigo').value.trim().toUpperCase();
      if (/^[A-Z0-9]{4}$/.test(codigo)) entrarSala('cliente', codigo);
    });

    if (!soportaVibracion) {
      $('aviso-vibracion').textContent = 'Este navegador no soporta la API de vibración: este móvil solo puede enviar.';
    }

    // Abrir con un enlace compartido (…/#CODIGO) entra directamente como cliente
    const codigoEnlace = location.hash.slice(1).toUpperCase();
    if (/^[A-Z0-9]{4}$/.test(codigoEnlace)) entrarSala('cliente', codigoEnlace);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
